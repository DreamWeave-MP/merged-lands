manifest_version = 1

[package]
id = "org.dreamweave.merged-lands"
version = "0.1.0"
jess_api = "1"
default_target = "merged-lands"
include = ["src", "tests"]
tests = ["tests/run.jsl", "tests/cli.jsl", "tests/style.jsl"]

[dependencies]
"org.dreamweave.esm" = "0.1"
"org.dreamweave.openmw-content" = "0.1"
"org.dreamweave.openmw-install" = "0.1"

[modules]
"@merged-lands" = "src/init.jsl"
"@merged-lands/cli" = "src/cli.jsl"

# Every module here is inert API: it does nothing until something requires it, and runs with the
# authority of whatever calls it. A merge reads the load order's content and patch files and
# writes its plugin, so its caller needs filesystem.read and filesystem.write.

[[layer]]
id = "merged-lands.core"
requires = ["esm.core", "openmw-content.core", "openmw-install.core"]
exports = ["@merged-lands", "@merged-lands/cli"]

# The merge's command line: `src/main.jsl` hands its arguments to `@merged-lands/cli`. It reads
# openmw.cfg and the configurations it includes, merged_lands.toml beside it, the data folders'
# listings, the content files with their sizes and dates, and their `.mergedlands.toml` patch
# files (filesystem.read); it makes the output folder, removes the plugin and patch file an
# earlier run left there, writes the plugin, and with --activate backs up and rewrites openmw.cfg
# (filesystem.write); and it reads OPENMW_CONFIG when no flag names the configuration
# (process.environment). It runs no other program and opens no connection.

[targets.merged-lands]
kind = "command"
command = "merged-lands"
entry = "src/main.jsl"
capabilities = ["filesystem.read", "filesystem.write", "process.environment", "process.stdio"]
