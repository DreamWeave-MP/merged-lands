# merged-lands as a DreamWeave project: a Jess package. `jess` names the Package Source it
# publishes, the jess.toml at the repository root, and each release tag `merged_lands-<version>` is one
# version of the package, packed by the Mod Template from that tag; every push packs a
# development build.
id = "79933d87-68dd-4476-945a-906e5a6f4f44"
slug = "merged_lands"
type = "tool"
status = "active"

[[maintainers]]
name = "DreamWeave"
url = "https://github.com/DreamWeave-MP"

[package]
format = "jpk"
jess = "org.dreamweave.merged-lands"

[[releases]]
version = "0.1.0"
date = 2026-10-21
summary = "First release published as a DreamWeave project."

[[releases]]
version = "0.1.1"
date = 2026-10-23
summary = "Merged Lands finds OpenMW's own configuration when none is named, as the original does."
added = [
    "With neither `--config` nor OPENMW_CONFIG, the openmw.cfg in the folder OpenMW keeps its own in on this platform: Documents\\My Games\\OpenMW on Windows, wherever Documents was moved, Library/Preferences/openmw on macOS, and the XDG config folder elsewhere. Its `?userconfig?` and `?userdata?` are OpenMW's own folders. Needs jess 0.2.1 or later.",
]
